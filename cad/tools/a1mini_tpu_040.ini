# PrusaSlicer approximation of an A1 mini 0.4 nozzle / 0.20 mm / TPU 95A profile, for the TPU plate (plate4_tpu):
# the PLA profile (a1mini_pla_020.ini) with TPU's temperatures, density, a 3.6 mm3/s flow limit, 100 % infill and a
# short retraction. Used only to estimate print time and filament (tools/print_report.py).
filament_type = FLEX
bed_shape = 0x0,180x0,180x180,0x180
max_print_height = 180
printer_technology = FFF
gcode_flavor = marlin2
