# PrusaSlicer approximation of Bambu Studio "Bambu Lab A1 mini 0.4 nozzle / 0.20mm Standard / Bambu PLA Basic"
# with the two changes recommended in ASSEMBLY_ja.md (3 wall loops, 15% gyroid). Used only to estimate print time
# and filament per plate (tools/slice_estimates.py); print with Bambu Studio and its own A1 mini profile.
